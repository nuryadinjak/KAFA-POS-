name: KAFA POS V12 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android module
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la
          echo "=== SETTINGS ==="
          cat settings.gradle.kts
          echo "=== APP ==="
          ls -la app
          echo "=== APP GRADLE ==="
          cat app/build.gradle.kts

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - name: Show APK
        if: always()
        run: |
          echo "=== APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAFA-POS-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAFA-POS-V12-APK
          path: "**/*.apk"
          if-no-files-found: error
      - name: Check APK
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAFA-POS-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
