name: Build KAFA POS V12 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "ROOT:"
          ls -la
          echo "APP:"
          ls -la app
          echo "APP SRC:"
          find app/src -maxdepth 5 -type f -print

      - name: Build APK
        run: gradle assembleDebug

      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAFA-POS-V12-APK
          path: "**/*.apk"
          if-no-files-found: error
      - name: Check APK
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAFA-POS-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
